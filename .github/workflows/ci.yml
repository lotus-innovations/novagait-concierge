name: CI

# Key-free by design: no ANTHROPIC_API_KEY exists anywhere in GitHub (not even
# as an Actions secret). All unit tests are pure logic against the in-memory
# store; model-in-the-loop evidence is produced locally and committed to docs/.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
